name: CI

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 35

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: money_tracker_ci_test
          POSTGRES_USER: money_tracker_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U money_tracker_ci -d money_tracker_ci_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    # These values are synthetic and valid only inside the disposable runner.
    # The database uses runner-local trust authentication, so no database
    # password is committed or printed.
    env:
      CI: "true"
      TEST_DATABASE_URL: postgresql://money_tracker_ci@127.0.0.1:5432/money_tracker_ci_test?schema=public
      AUTH_SECRET: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      AUTH_GOOGLE_ID: ci-only-google-client
      AUTH_GOOGLE_SECRET: cccccccccccccccccccccccccccccccccccccccc
      AUTH_URL: https://money-tracker-ci.example.test
      BOOTSTRAP_ADMIN_EMAIL: ci-admin@example.test
      RATE_LIMIT_HASH_SECRET: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
      OTEL_SERVICE_NAME: money-tracker-ci

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan committed history for secrets
        shell: bash
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_ARCHIVE_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -Eeuo pipefail
          archive="${RUNNER_TEMP}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          binary="${RUNNER_TEMP}/gitleaks"

          curl --fail --silent --show-error --location \
            --retry 3 --retry-all-errors \
            --proto '=https' --proto-redir '=https' --tlsv1.2 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "${archive}"

          printf '%s  %s\n' "${GITLEAKS_ARCHIVE_SHA256}" "${archive}" |
            sha256sum --check --strict
          tar --extract --gzip \
            --file "${archive}" \
            --directory "${RUNNER_TEMP}" \
            gitleaks
          chmod 0500 "${binary}"
          "${binary}" version
          "${binary}" git --redact --no-banner --verbose "${GITHUB_WORKSPACE}"

      - name: Install pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.2
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install pinned npm
        run: npm install --global npm@11.11.0 --no-audit --no-fund

      - name: Verify toolchain
        run: |
          node --version
          npm --version

      # setup-node caches only npm's content-addressed download cache. It does
      # not cache node_modules, .next, generated Prisma output, or environment files.
      - name: Clean dependency installation
        run: npm ci --no-audit --no-fund

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Deploy migrations to disposable PostgreSQL
        run: npm run db:test:migrate
        env:
          NODE_ENV: test

      - name: Validate Prisma schema
        run: npm run db:validate

      - name: Verify migration status
        run: npm run db:test:status

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit
        env:
          NODE_ENV: test

      - name: PostgreSQL integration and concurrency tests
        run: npm run test:integration
        env:
          NODE_ENV: test

      - name: Authorization matrix tests
        run: npm run test:authorization
        env:
          NODE_ENV: test

      - name: Dead-code and dependency analysis
        run: npm run knip

      - name: Webpack compatibility build
        run: npm run build:webpack
        env:
          DATABASE_URL: postgresql://money_tracker_build@127.0.0.1:5432/money_tracker_build_placeholder?schema=public

      - name: Verify Proxy manifest after Webpack build
        run: npm run verify:proxy-manifest

      - name: Default production build
        run: npm run build
        env:
          DATABASE_URL: postgresql://money_tracker_build@127.0.0.1:5432/money_tracker_build_placeholder?schema=public

      - name: Verify Proxy manifest after default build
        run: npm run verify:proxy-manifest

      - name: Verify pruned standalone runtime artifact
        run: npm run runtime:prune && npm run runtime:verify

      - name: Dependency audits
        run: npm run audit

      - name: Install Chromium for required E2E
        run: npx --no-install playwright install --with-deps chromium

      - name: Required pruned-runtime E2E smoke
        shell: bash
        env:
          NODE_ENV: test
        run: |
          set -Eeuo pipefail
          server_log="${RUNNER_TEMP}/money-tracker-next.log"
          # VERCEL=1 intentionally exercises the managed dynamic-host topology
          # for this runner-only HTTP server; self-hosted production must use
          # its canonical HTTPS AUTH_URL instead.
          DATABASE_URL="${TEST_DATABASE_URL}" E2E_BASE_URL=http://127.0.0.1:3000 \
            VERCEL=1 HOSTNAME=127.0.0.1 PORT=3000 \
            node .next/standalone/server.js >"${server_log}" 2>&1 &
          server_pid=$!
          cleanup() {
            kill "${server_pid}" 2>/dev/null || true
            wait "${server_pid}" 2>/dev/null || true
          }
          trap cleanup EXIT

          if ! curl --fail --silent --show-error \
            --retry 30 --retry-delay 1 --retry-all-errors --retry-connrefused \
            http://127.0.0.1:3000/api/health >/dev/null; then
            tail -n 100 "${server_log}"
            exit 1
          fi

          E2E_BASE_URL=http://127.0.0.1:3000 npm run test:e2e
